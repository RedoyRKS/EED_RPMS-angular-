<section class="login-page">
  <div class="login-card">
    <header class="login-header">
      <img
        class="login-logo"
        src="images/eed-logo.png"
        width="96"
        height="96"
        i18n-alt="@@login.logoAlt"
        alt="Government of the People's Republic of Bangladesh"
      />
      <h1 i18n="@@login.title">EED RPMS</h1>
      <p class="login-subtitle" i18n="@@login.subtitle">Education Engineering Department</p>
    </header>

    <form class="login-form" [formGroup]="form" (ngSubmit)="onSubmit()" novalidate>
      <p-floatlabel variant="on">
        <input
          pInputText
          id="username"
          formControlName="username"
          autocomplete="username"
          [fluid]="true"
          [invalid]="submitted() && form.controls.username.invalid"
        />
        <label for="username" i18n="@@login.username">Username</label>
      </p-floatlabel>
      @if (submitted() && form.controls.username.invalid) {
        <small class="login-error" i18n="@@login.usernameRequired">Username is required.</small>
      }

      <p-floatlabel variant="on">
        <input
          pInputPassword
          id="password"
          formControlName="password"
          autocomplete="current-password"
          [fluid]="true"
          [invalid]="submitted() && form.controls.password.invalid"
        />
        <label for="password" i18n="@@login.password">Password</label>
      </p-floatlabel>
      @if (submitted() && form.controls.password.invalid) {
        <small class="login-error" i18n="@@login.passwordRequired">Password is required.</small>
      }

      <p-button
        type="submit"
        styleClass="login-submit"
        [fluid]="true"
        i18n-label="@@login.submit"
        label="Sign In"
      />
    </form>
  </div>
</section>
